<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nohitto Buritto | Ana Sayfa</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
  <img src="nohitto-logo.png" alt="Nohitto Buritto Logo">
  <nav>
    <a href="index.html">Ana Sayfa</a>
    <a href="menu.html">Menü</a>
    <a href="iletisim.html">İletişim</a>
  </nav>
</header>

<div class="content-wrapper">
  <main>

    <img class="nohut-img" src="nohutu-hackledik.png" alt="Nohutu Hackledik">

    <h2>Son Paylaşımlar</h2>

    <div class="ig-grid" id="igEmbeds"></div>

    <script async src="https://www.instagram.com/embed.js"></script>
    <script>
      const postUrls = [
        "https://www.instagram.com/p/DS6q8vviEsr/"
      ];

      const container = document.getElementById("igEmbeds");

      postUrls.forEach(url => {
        const card = document.createElement("div");
        card.className = "ig-card";
        card.innerHTML = `
          <blockquote class="instagram-media"
            data-instgrm-permalink="${url}"
            data-instgrm-version="14"
            style="background:#fff; border:0; margin:0; padding:0; width:100%;">
          </blockquote>
          <p><a target="_blank" href="${url}">Postu Instagram’da aç</a></p>
        `;
        container.appendChild(card);
      });

      window.setTimeout(() => {
        if (window.instgrm && window.instgrm.Embeds) {
          window.instgrm.Embeds.process();
        }
      }, 900);
    </script>

  </main>
</div>

<footer>© 2025 • Nohitto Buritto – Tüm hakları saklıdır.</footer>
</body>
</html>
